<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor scenario player</title>
<style>
  :root{--bg:#12162b;--card:#1c2142;--card2:#252b54;--ink:#fff;--mute:#a9b0d6;--coral:#ff5d73;--mint:#2ee6a8;--sun:#ffc857;--sky:#5aa9ff;--violet:#a78bfa;--grid:#3a4068}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:26px;margin:0 0 2px} h1 span{color:var(--sun)}
  .sub{color:var(--mute);margin:0 0 16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:0;border-radius:999px;padding:8px 16px;background:var(--card);color:var(--mute);font:600 14px inherit;cursor:pointer}
  .tab[aria-selected=true]{background:var(--sun);color:#12162b}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:14px;padding:16px}
  .card h2{font-size:17px;margin:0 0 6px} .card h3{font-size:13px;margin:0 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
  .blurb p{margin:4px 0;color:var(--mute)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  select,button.ctl{background:var(--card2);color:var(--ink);border:0;border-radius:10px;padding:8px 12px;font:600 14px inherit}
  button.ctl{cursor:pointer} button.go{background:var(--mint);color:#12162b}
  input[type=range]{accent-color:var(--mint);flex:1;min-width:140px}
  svg{width:100%;height:auto;display:block}
  .axis{fill:var(--mute);font-size:11px} .lbl{fill:var(--mute);font-size:12px}
  .verdict{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--card2);color:var(--ink);min-height:44px}
  .verdict b{color:var(--sun)}
  .pipe{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
  .node{flex:0 0 auto;padding:8px 12px;border-radius:12px;background:var(--card2);font-weight:700;font-size:14px;text-align:center}
  .node.mon{background:var(--sun);color:#12162b}
  .track{position:relative;flex:1;height:2px;background:var(--grid)}
  .packet{position:absolute;top:-8px;left:0;width:18px;height:18px;border-radius:50%;background:var(--coral);opacity:0}
  .packet.fly{animation:fly 1s ease-in-out forwards}
  @keyframes fly{0%{left:0;opacity:1}90%{opacity:1}100%{left:calc(100% - 18px);opacity:0}}
  .inbox{color:var(--mute);font-size:13px;margin-bottom:8px} .inbox b{color:var(--mint);font-size:18px}
  pre{margin:0;background:#0e1124;border-radius:10px;padding:12px;overflow:auto;max-height:340px;font:12.5px/1.45 ui-monospace,Consolas,Menlo,monospace;color:#cfe}
  pre .k{color:var(--sky)} pre .s{color:var(--sun)} pre .n{color:var(--mint)}
  .empty{color:var(--mute);font-style:italic;padding:18px 4px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0;font-size:14px} .kv span:nth-child(odd){color:var(--mute)}
  .gauge{height:22px;background:var(--card2);border-radius:11px;position:relative;margin:14px 0 4px}
  .gauge i{position:absolute;top:0;bottom:0;border-radius:11px}
  .gauge u{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
  .small{font-size:12px;color:var(--mute)}
  footer{margin-top:18px;color:var(--mute);font-size:12px}
</style>
</head>

const $ = (id) => document.getElementById(id);

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function pretty(o){
  return esc(JSON.stringify(o,null,2)).replace(/(&quot;|")([\w]+)(&quot;|")(:)/g,'<span class="k">"$2"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="s">"$1"</span>').replace(/: (-?\d[\d.e+-]*)/g,': <span class="n">$1</span>');

function showAlert(a){ $("json").innerHTML = a ? pretty(a) : '<span class="small">No alert yet. Press Play.</span>'; }

// ---------- tabs / example picker ----------
function buildTabs(){
  DATA.scenarios.forEach((s,i)=>{
    const b=document.createElement("button"); b.className="tab"; b.textContent=s.tab; b.setAttribute("role","tab");
    b.onclick=()=>selectScenario(i); b.id="tab"+i; $("tabs").appendChild(b);
  });
  $("foot").textContent = "Data source: "+DATA.built_from+" (rebuild with python -m scripts.06_scenario_page)";
}
function selectScenario(i){
  sc = DATA.scenarios[i];
  DATA.scenarios.forEach((_,k)=>$("tab"+k).setAttribute("aria-selected", k===i));
  $("blurb").innerHTML = "<h2>"+esc(sc.title)+"</h2>"+sc.blurb.map(t=>"<p>"+esc(t)+"</p>").join("");
  const sel = '<select id="pick" aria-label="Example">'+sc.examples.map((e,k)=>'<option value="'+k+'">'+esc(e.label)+'</option>').join("")+"</select>";
  if (sc.kind==="series"){
    $("bar").innerHTML = sel+'<button class="ctl go" id="play">▶ Play</button><button class="ctl" id="reset">⟲ Reset</button>'+
      '<select id="speed" aria-label="Speed"><option value="0.5">slow</option><option value="1" selected>normal</option><option value="3">fast</option></select>'+
      '<input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Time">';
    $("play").onclick=togglePlay; $("reset").onclick=()=>loadExample(+$("pick").value);
    $("speed").onchange=(e)=>speed=+e.target.value; $("scrub").oninput=(e)=>{pause(); idx=+e.target.value; render(true)};
  } else {
    $("bar").innerHTML = sel+'<button class="ctl go" id="send">Send to Triage</button>';
    $("send").onclick=()=>{ sent=true; renderStatic(); if(ex.alert){fly(); showAlert(ex.alert); setInbox(1);} };
  }
  $("pick").onchange=(e)=>loadExample(+e.target.value);
  loadExample(0);
}
function loadExample(k){
  pause(); ex = sc.examples[k]; idx = 0; fired = 0; sent = false; showAlert(null); setInbox(0);
  if (sc.kind==="series"){ $("scrub").max = ex.signal.length-1; $("scrub").value = 0; render(true); }

}

// ---------- playback ----------
function togglePlay(){ playing ? pause() : play(); }
function play(){
  if (idx >= ex.signal.length-1){ idx=0; fired=0; showAlert(null); setInbox(0); }
  playing=true; $("play").textContent="⏸ Pause"; last=performance.now(); raf=requestAnimationFrame(tick);
}
function pause(){ playing=false; cancelAnimationFrame(raf); const p=$("play"); if(p) p.textContent="▶ Play"; }
function tick(now){
  const n = ex.signal.length, perSec = Math.max(n/14, 4)*speed;      // whole replay lasts ~14 s at normal speed
  idx = Math.min(idx + (now-last)/1000*perSec, n-1); last = now;
  render(false);
  if (idx >= n-1){ pause(); render(true); return; }
  raf = requestAnimationFrame(tick);
}

// ---------- SVG helpers ----------
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function scale(d0,d1,r0,r1){ return v => r0 + (v-d0)/((d1-d0)||1)*(r1-r0); }
